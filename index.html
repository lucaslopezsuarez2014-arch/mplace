<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelCanvas - Local Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #root { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // Icons as SVG components (Lucide)
    const XIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );
    const CheckIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    );
    const PlusIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );
    const MinusIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );
    const Maximize2Icon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    );
    const HelpCircleIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    );

    // Button component (shadcn-like)
    function Button({ children, variant = 'default', size = 'default', className = '', disabled = false, onClick }) {
      const baseClasses = 'px-4 py-2 rounded-md font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        default: 'bg-white text-black hover:bg-gray-200',
        ghost: 'bg-transparent hover:bg-gray-800 text-white border border-gray-600',
        outline: 'bg-transparent border border-gray-600 text-white hover:bg-gray-800'
      };
      const sizes = {
        icon: 'h-10 w-10',
        lg: 'px-8 py-3 text-lg'
      };
      return (
        <button
          className={`${baseClasses} ${variants[variant] || variants.default} ${sizes[size] || ''} ${className}`}
          disabled={disabled}
          onClick={onClick}
        >
          {children}
        </button>
      );
    }

    // CoordinatesDisplay
    function CoordinatesDisplay({ coords, zoom }) {
      return (
        <div className="bg-[#1a1a1b] border border-[#343536] rounded-full px-4 py-2 text-white font-mono text-sm shadow-lg">
          {coords ? <span>({coords.x}, {coords.y})</span> : <span>---</span>}
          <span className="text-gray-500 ml-2">{zoom.toFixed(2)}x</span>
        </div>
      );
    }

    // ZoomControls
    function ZoomControls({ zoom, onZoomChange, onReset }) {
      return (
        <div className="flex flex-col gap-1 bg-[#1a1a1b] border border-[#343536] rounded-lg p-1 shadow-lg">
          <Button variant="ghost" size="icon" onClick={() => onZoomChange(Math.min(zoom * 1.5, 10))} className="h-8 w-8">
            <PlusIcon />
          </Button>
          <Button variant="ghost" size="icon" onClick={() => onZoomChange(Math.max(zoom / 1.5, 0.5))} className="h-8 w-8">
            <MinusIcon />
          </Button>
          <Button variant="ghost" size="icon" onClick={onReset} className="h-8 w-8">
            <Maximize2Icon />
          </Button>
        </div>
      );
    }

    // ColorPalette
    function ColorPalette({ selectedColor, onColorSelect, onCancel, onConfirm, showActions }) {
      const COLORS = [
        '#000000', '#1D1D1D', '#4A4A4A', '#787878', '#A5A5A5', '#D4D4D4', '#FFFFFF',
        '#FF4500', '#FFA800', '#FFD635', '#00A368', '#7EED56', '#2450A4', '#3690EA',
        '#51E9F4', '#811E9F', '#B44AC0', '#FF99AA', '#9C6926', '#6D482F',
        '#BE0039', '#FF3881', '#6A5CFF', '#493AC1', '#009EAA', '#00756F',
        '#00CC78', '#94B3FF', '#E4ABFF', '#DE107F', '#FF6D00', '#FFB470'
      ];
      return (
        <div className="bg-[#1a1a1b] border-t border-[#343536] p-4 shadow-2xl">
          <div className="flex flex-wrap justify-center gap-1 max-w-2xl mx-auto">
            {COLORS.map((color) => (
              <button
                key={color}
                onClick={() => onColorSelect(color)}
                className={`w-10 h-10 rounded transition-all duration-150 hover:scale-110 ${selectedColor === color ? 'ring-4 ring-white ring-offset-2 ring-offset-[#1a1a1b] shadow-2xl' : 'hover:ring-2 hover:ring-white/50 hover:shadow-lg'}`}
                style={{ backgroundColor: color }}
                title={color}
              />
            ))}
          </div>
          {showActions && (
            <div className="flex justify-center gap-3 mt-6">
              <Button variant="outline" size="lg" onClick={onCancel} className="px-8">
                <XIcon />
              </Button>
              <Button size="lg" onClick={onConfirm} disabled={!selectedColor} className="px-8">
                <CheckIcon />
              </Button>
            </div>
          )}
        </div>
      );
    }

    // PixelCanvas (adapted)
    function PixelCanvas({ pixels, selectedColor, onPixelClick, zoom, offset, onOffsetChange, onHoverPixel, disabled, canvasSize = 100 }) {
      const CANVAS_SIZE = canvasSize;
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [hoveredPixel, setHoveredPixel] = useState(null);

      const pixelMap = useMemo(() => {
        const map = new Map();
        pixels.forEach(pixel => map.set(`${pixel.x},${pixel.y}`, pixel));
        return map;
      }, [pixels]);

      const drawCanvas = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const scaledPixelSize = 10 * zoom;
        ctx.fillStyle = '#1a1a1b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const startX = Math.max(0, Math.floor(-offset.x / scaledPixelSize));
        const startY = Math.max(0, Math.floor(-offset.y / scaledPixelSize));
        const endX = Math.min(CANVAS_SIZE, Math.ceil((canvas.width - offset.x) / scaledPixelSize));
        const endY = Math.min(CANVAS_SIZE, Math.ceil((canvas.height - offset.y) / scaledPixelSize));
        ctx.fillStyle = '#2d2d2f';
        for (let x = startX; x < endX; x++) {
          for (let y = startY; y < endY; y++) {
            const drawX = x * scaledPixelSize + offset.x;
            const drawY = y * scaledPixelSize + offset.y;
            ctx.fillRect(drawX + 0.5, drawY + 0.5, scaledPixelSize - 1, scaledPixelSize - 1);
          }
        }
        pixels.forEach(pixel => {
          const x = pixel.x;
          const y = pixel.y;
          if (x >= startX && x < endX && y >= startY && y < endY) {
            const drawX = x * scaledPixelSize + offset.x;
            const drawY = y * scaledPixelSize + offset.y;
            ctx.fillStyle = pixel.color;
            ctx.fillRect(drawX + 0.5, drawY + 0.5, scaledPixelSize - 1, scaledPixelSize - 1);
          }
        });
        if (hoveredPixel && !isDragging && selectedColor && !disabled) {
          const drawX = hoveredPixel.x * scaledPixelSize + offset.x;
          const drawY = hoveredPixel.y * scaledPixelSize + offset.y;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.strokeRect(drawX, drawY, scaledPixelSize, scaledPixelSize);
          ctx.fillStyle = selectedColor + '80';
          ctx.fillRect(drawX + 1, drawY + 1, scaledPixelSize - 2, scaledPixelSize - 2);
        }
      }, [pixels, zoom, offset, hoveredPixel, selectedColor, isDragging, disabled, canvasSize]);

      useEffect(() => {
        const handleResize = () => {
          const canvas = canvasRef.current;
          const container = containerRef.current;
          if (!canvas || !container) return;
          canvas.width = container.clientWidth;
          canvas.height = container.clientHeight;
          drawCanvas();
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, [drawCanvas]);

      useEffect(() => drawCanvas(), [drawCanvas]);

      const getPixelCoords = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const scaledPixelSize = 10 * zoom;
        const x = Math.floor((e.clientX - rect.left - offset.x) / scaledPixelSize);
        const y = Math.floor((e.clientY - rect.top - offset.y) / scaledPixelSize);
        if (x >= 0 && x < CANVAS_SIZE && y >= 0 && y < CANVAS_SIZE) return { x, y };
        return null;
      };

      const handleMouseDown = (e) => {
        setIsDragging(true);
        setDragStart({ x: e.clientX - offset.x, y: e.clientY - dragStart.y });
      };
      const handleMouseMove = (e) => {
        if (isDragging) {
          onOffsetChange({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
        } else {
          const coords = getPixelCoords(e);
          setHoveredPixel(coords);
          if (coords) onHoverPixel(coords, pixelMap.get(`${coords.x},${coords.y}`));
          else onHoverPixel(null, null);
        }
      };
      const handleMouseUp = (e) => {
        if (!isDragging) {
          const coords = getPixelCoords(e);
          if (coords && selectedColor && !disabled) onPixelClick(coords.x, coords.y);
        }
        setIsDragging(false);
      };
      const handleMouseLeave = () => {
        setIsDragging(false);
        setHoveredPixel(null);
        onHoverPixel(null, null);
      };

      return (
        <div ref={containerRef} className="w-full h-full overflow-hidden cursor-crosshair" style={{ touchAction: 'none' }}>
          <canvas
            ref={canvasRef}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseLeave}
            className="block select-none"
          />
        </div>
      );
    }

    // UsernameModal
    function UsernameModal({ open, onSubmit }) {
      const [value, setValue] = useState('');
      if (!open) return null;
      const handleSubmit = (e) => {
        e.preventDefault();
        if (value.trim()) {
          onSubmit(value.trim());
        }
      };
      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-[#1a1a1b] border border-[#343536] rounded-2xl p-8 max-w-md w-full shadow-2xl">
            <h2 className="text-2xl font-bold text-white mb-6 text-center">Ingresa tu nombre de usuario</h2>
            <form onSubmit={handleSubmit} className="space-y-4">
              <input
                type="text"
                value={value}
                onChange={(e) => setValue(e.target.value)}
                placeholder="@usuario"
                maxLength={20}
                className="w-full px-4 py-3 bg-[#272729] border border-[#343536] rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                required
                autoFocus
              />
              <Button type="submit" size="lg" className="w-full">
                ¡Empezar!
              </Button>
            </form>
          </div>
        </div>
      );
    }

    // WelcomeModal
    function WelcomeModal({ open, onClose }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-[#1a1a1b] border border-[#343536] rounded-2xl p-8 max-w-md w-full shadow-2xl text-center">
            <h2 className="text-2xl font-bold text-white mb-4">¡Bienvenido a PixelCanvas!</h2>
            <p className="text-gray-300 mb-6">Coloca píxeles en el canvas compartido. Espera 30s entre colocaciones.</p>
            <div className="flex gap-3 justify-center">
              <Button size="lg" onClick={onClose}>¡Comenzar!</Button>
            </div>
          </div>
        </div>
      );
    }

    // PixelTooltip
    function PixelTooltip({ pixel, coords, position }) {
      if (!pixel || !coords || !position) return null;
      return (
        <div
          className="absolute bg-[#272729] border border-[#343536] rounded-lg px-3 py-2 text-sm text-white shadow-2xl pointer-events-none z-20 whitespace-nowrap"
          style={{
            left: position.x + 10,
            top: position.y - 40,
            transform: 'translateZ(0)'
          }}
        >
          <div>@{pixel.placed_by}</div>
          <div className="text-xs text-gray-400">{new Date(pixel.placed_at).toLocaleString()}</div>
        </div>
      );
    }

    // Layout
    function Layout({ children }) {
      return <div className="min-h-screen bg-[#1a1a1b]">{children}</div>;
    }

    // Main Place component (adapted for static)
    function Place() {
      const [username, setUsername] = useState(localStorage.getItem('pixel_username') || null);
      const [showUsernameModal, setShowUsernameModal] = useState(!localStorage.getItem('pixel_username'));
      const [showWelcome, setShowWelcome] = useState(false);
      const [showPalette, setShowPalette] = useState(false);
      const [selectedColor, setSelectedColor] = useState(null);
      const [pixels, setPixels] = useState([
        // Mock initial pixels
        {x: 50, y: 50, color: '#FF0000', placed_by: 'demo', placed_at: new Date().toISOString()},
        {x: 51, y: 50, color: '#00FF00', placed_by: 'demo', placed_at: new Date().toISOString()},
        {x: 52, y: 50, color: '#0000FF', placed_by: 'demo', placed_at: new Date().toISOString()},
        // Add more for demo...
        ...Array.from({length: 200}, (_, i) => ({
          x: Math.floor(Math.random() * 100),
          y: Math.floor(Math.random() * 100),
          color: ['#FF4500', '#FFA800', '#FFD635', '#00A368', '#7EED56'][Math.floor(Math.random()*5)],
          placed_by: 'demo',
          placed_at: new Date(Date.now() - Math.random()*1000000).toISOString()
        }))
      ]);
      const [canvasSize] = useState(100);
      const [zoom, setZoom] = useState(1);
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const [hoveredCoords, setHoveredCoords] = useState(null);
      const [hoveredPixel, setHoveredPixel] = useState(null);
      const [mousePosition, setMousePosition] = useState({ x: 0, y: 0 });
      const [cooldownEnd, setCooldownEnd] = useState(null);
      const containerRef = useRef(null);
      const isAdmin = username === 'admin';

      const COOLDOWN_MS = 30000; // 30s demo cooldown

      const handleUsernameSubmit = (newUsername) => {
        setUsername(newUsername);
        localStorage.setItem('pixel_username', newUsername);
        setShowUsernameModal(false);
        if (!localStorage.getItem('pixel_welcome_shown')) {
          setShowWelcome(true);
          localStorage.setItem('pixel_welcome_shown', 'true');
        }
      };

      const handlePixelClick = (x, y) => {
        if (!username || !selectedColor) return;
        // Mock place pixel (local state)
        const newPixel = { x, y, color: selectedColor, placed_by: username, placed_at: new Date().toISOString() };
        setPixels(prev => [...prev.filter(p => !(p.x === x && p.y === y)), newPixel]);
        // Mock cooldown
        setCooldownEnd(Date.now() + COOLDOWN_MS);
        setShowPalette(false);
        setSelectedColor(null);
        // Simple toast
        showToast('¡Píxel colocado!');
      };

      useEffect(() => {
        const handleMouseMove = (e) => setMousePosition({ x: e.clientX, y: e.clientY });
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      useEffect(() => {
        if (containerRef.current) {
          const { width, height } = containerRef.current.getBoundingClientRect();
          const canvasWidth = canvasSize * 10 * zoom;
          const canvasHeight = canvasSize * 10 * zoom;
          setOffset({ x: (width - canvasWidth) / 2, y: (height - canvasHeight) / 2 });
        }
      }, [zoom]);

      const handleResetView = () => {
        if (containerRef.current) {
          const { width, height } = containerRef.current.getBoundingClientRect();
          setZoom(1);
          setOffset({ x: (width - canvasSize * 10) / 2, y: (height - canvasSize * 10) / 2 });
        }
      };

      const isCoolingDown = cooldownEnd && cooldownEnd > Date.now();

      // Simple toast
      function showToast(message) {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-2xl z-50 animate-in slide-in-from-right fade-in duration-300';
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.remove();
        }, 3000);
      }

      return (
        <div className="h-screen w-screen bg-[#1a1a1b] flex flex-col overflow-hidden relative">
          <UsernameModal open={showUsernameModal} onSubmit={handleUsernameSubmit} />
          <WelcomeModal open={showWelcome} onClose={() => setShowWelcome(false)} />
          {username && (
            <div className="absolute top-4 left-4 z-10 flex gap-2 items-center">
              <div className="bg-[#272729] rounded-full px-4 py-2 text-white text-sm font-medium">
                @{username}
                {isAdmin && <span className="ml-2 text-red-500 font-bold">ADMIN</span>}
              </div>
            </div>
          )}
          <div className="absolute top-4 left-1/2 -translate-x-1/2 z-10">
            <CoordinatesDisplay coords={hoveredCoords} zoom={zoom} />
          </div>
          <div className="absolute top-4 right-4 z-10">
            <Button variant="ghost" size="icon" onClick={() => setShowWelcome(true)} className="rounded-full bg-[#272729] hover:bg-[#343536]">
              <HelpCircleIcon />
            </Button>
          </div>
          <div ref={containerRef} className="flex-1 relative">
            <PixelCanvas
              pixels={pixels}
              selectedColor={selectedColor}
              onPixelClick={handlePixelClick}
              zoom={zoom}
              offset={offset}
              onOffsetChange={setOffset}
              onHoverPixel={(coords, pixel) => {
                setHoveredCoords(coords);
                setHoveredPixel(pixel);
              }}
              disabled={isCoolingDown || !showPalette}
              canvasSize={canvasSize}
            />
            <div className="absolute right-4 bottom-32 z-10">
              <ZoomControls zoom={zoom} onZoomChange={setZoom} onReset={handleResetView} />
            </div>
            {isCoolingDown && (
              <div className="absolute left-4 bottom-32 z-10 bg-[#272729] border border-[#343536] rounded-lg px-4 py-2 text-white text-sm shadow-lg">
                Espera {Math.ceil((cooldownEnd - Date.now()) / 1000)}s
              </div>
            )}
          </div>
          {showPalette ? (
            <ColorPalette
              selectedColor={selectedColor}
              onColorSelect={setSelectedColor}
              onCancel={() => { setShowPalette(false); setSelectedColor(null); }}
              onConfirm={() => {
                if (selectedColor && hoveredCoords) {
                  handlePixelClick(hoveredCoords.x, hoveredCoords.y);
                }
              }}
              showActions={true}
            />
          ) : (
            <div className="flex justify-center p-6 bg-gradient-to-b from-[#1a1a1b] to-[#272729]">
              <Button
                onClick={() => setShowPalette(true)}
                disabled={isCoolingDown}
                size="lg"
                className="bg-white text-black hover:bg-gray-200 text-lg px-8 py-4 font-semibold shadow-2xl"
              >
                {isCoolingDown ? 'Esperando...' : '¡Coloca un píxel!'}
              </Button>
            </div>
          )}
          <PixelTooltip pixel={hoveredPixel} coords={hoveredCoords} position={mousePosition} />
        </div>
      );
    }

    // Render
    function App() {
      return <Place />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
